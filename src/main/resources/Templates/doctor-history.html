<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Medical History - Doctor Panel</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #F0F8FF;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header {
            background: #0056B3;
            padding: 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .header h1 {
            font-size: 28px;
            margin: 0;
        }
        .header a {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
        }
        .content {
            padding: 30px;
        }
        .message-box, .error-message {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .message-box { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .error-message { background: #fee; color: #c33; border-left: 4px solid #c33; }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 15px;
            border-bottom: 1px solid #e0e7ff;
            text-align: left;
        }
        thead {
            background: #f8f9ff;
        }
        tr:hover { background: #f9f9ff; }
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-pending { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        .status-approved { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-rejected { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .btn-small {
            padding: 8px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            background: #0056B3;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📜 Medical History</h1>
            <div>
                <a href="/doctor/appointments">← Appointments</a>
                <a href="/doctor/logout">Logout</a>
            </div>
        </div>
        <div class="content">
            <div th:if="${message}" class="message-box" th:text="${message}"></div>
            <div th:if="${error}" class="error-message" th:text="${error}"></div>

            <div th:if="${appointments != null and appointments.size() > 0}">
                <table>
                    <thead>
                        <tr>
                            <th>Patient</th>
                            <th>Email</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Diagnosis</th>
                            <th>Prescription</th>
                            <th>Notes</th>
                            <th>Export</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="appointment : ${appointments}">
                            <td th:text="${appointment.patient.patientFirstName + ' ' + appointment.patient.patientLastName}"></td>
                            <td th:text="${appointment.patient.patientEmail}"></td>
                            <td th:text="${#temporals.format(appointment.id.time, 'dd MMM yyyy, HH:mm')}"></td>
                            <td>
                                <span th:class="${'status-badge status-' + appointment.status.name().toLowerCase()}" th:text="${appointment.status.displayName}"></span>
                            </td>
                            <td th:text="${appointment.diagnosis != null ? appointment.diagnosis : '—'}"></td>
                            <td th:text="${appointment.prescription != null ? appointment.prescription : '—'}"></td>
                            <td th:text="${appointment.doctorNotes != null ? appointment.doctorNotes : '—'}"></td>
                            <td>
                                <a th:href="@{/doctor/download-patient-data(patientId=${appointment.patient.patientId})}" class="btn-small">Download</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${appointments == null or appointments.isEmpty()}">
                <p>No medical history available yet.</p>
            </div>
        </div>
    </div>
</body>
</html>
