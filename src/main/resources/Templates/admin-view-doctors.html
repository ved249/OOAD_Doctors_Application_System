<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Doctor Management - Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #F0F8FF;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: #0056B3;
            padding: 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header h1 {
            font-size: 28px;
            margin: 0;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
        }

        .btn-primary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
        }

        .btn-primary:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-warning {
            background: #ffc107;
            color: #333;
        }

        .btn-warning:hover {
            background: #e0a800;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .content {
            padding: 30px;
        }

        .message-box {
            background: #d4edda;
            color: #155724;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #28a745;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #c33;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #dee2e6;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .action-btn-edit {
            background: #ffc107;
            color: #333;
        }

        .action-btn-edit:hover {
            background: #e0a800;
        }

        .action-btn-delete {
            background: #dc3545;
            color: white;
        }

        .action-btn-delete:hover {
            background: #c82333;
        }

        .no-data {
            text-align: center;
            color: #999;
            padding: 40px;
        }

        .spec-badge {
            display: inline-block;
            background: #0056B3;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 10px;
            }

            .action-buttons {
                flex-direction: column;
                gap: 5px;
            }

            .action-btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👨‍⚕️ Doctor Management</h1>
            <div class="header-buttons">
                <a href="/admin/add-doctor" class="btn btn-success">+ Add Doctor</a>
                <a href="/admin/dashboard" class="btn btn-primary">← Dashboard</a>
            </div>
        </div>

        <div class="content">
            <div th:if="${message}" class="message-box" th:text="${message}"></div>
            <div th:if="${error}" class="error-message" th:text="${error}"></div>

            <div th:if="${doctors.isEmpty()}" class="no-data">
                <p>No doctors found. <a href="/admin/add-doctor">Add the first doctor</a></p>
            </div>

            <div th:if="${!doctors.isEmpty()}">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 150px;">Doctor Name</th>
                            <th style="width: 200px;">Email</th>
                            <th style="width: 150px;">Specialization</th>
                            <th style="width: 200px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="doctor : ${doctors}">
                            <td th:text="${doctor.doctorName}">John Doe</td>
                            <td th:text="${doctor.doctorEmail}">john@example.com</td>
                            <td>
                                <span class="spec-badge" th:text="${doctor.specialization}">Cardiology</span>
                            </td>
                            <td>
                                <div class="action-buttons">
                                    <a th:href="'/admin/edit-doctor?doctorId=' + ${doctor.doctorId}" class="action-btn action-btn-edit">✏️ Edit</a>
                                    <form method="post" action="/admin/delete-doctor" style="display: inline;">
                                        <input type="hidden" name="doctorId" th:value="${doctor.doctorId}">
                                        <button type="submit" class="action-btn action-btn-delete" onclick="return confirm('Are you sure?');">🗑️ Delete</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
