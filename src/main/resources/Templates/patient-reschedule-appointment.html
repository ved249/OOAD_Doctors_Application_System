<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Reschedule Appointment - Doctor Appointment System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #F0F8FF;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            max-width: 500px;
            width: 100%;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: #0056B3;
            padding: 40px 30px;
            text-align: center;
            color: white;
        }

        .header h2 {
            font-size: 28px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .header p {
            font-size: 13px;
            opacity: 0.9;
        }

        .form-container {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="datetime-local"],
        select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input[type="datetime-local"]:focus,
        select:focus {
            outline: none;
            border-color: #0056B3;
            box-shadow: 0 0 0 3px rgba(0, 86, 179, 0.1);
        }

        button[type="submit"] {
            width: 100%;
            padding: 15px;
            background: #0056B3;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 86, 179, 0.4);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            border-left: 4px solid #c33;
        }

        .btn-cancel {
            width: 100%;
            padding: 15px;
            background: #e0e0e0;
            color: #333;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-cancel:hover {
            background: #d0d0d0;
        }

        .form-info {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            border: 1px solid #e0e7ff;
            font-size: 13px;
            color: #555;
            text-align: center;
        }

        .icon {
            font-size: 30px;
            margin-bottom: 15px;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #0056B3;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="icon">📅</div>
            <h2>Reschedule Appointment</h2>
            <p>Choose a new date and time</p>
        </div>

        <div class="form-container">
            <div class="error-message" th:if="${error}" th:text="${error}"></div>

            <form method="post" action="/patient/reschedule-appointment">
                <div class="form-group">
                    <label>Select Doctor:</label>
                    <select name="doctorId" required>
                        <option value="">-- Choose a Doctor --</option>
                        <option th:each="doctor : ${doctors}" th:value="${doctor.doctorId}" th:text="${doctor.doctorName}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label>New Appointment Date & Time:</label>
                    <input type="datetime-local" name="newAppointmentDateTime" required>
                </div>

                <input type="hidden" name="appointmentId" th:value="${appointmentId}">
                <input type="hidden" name="oldAppointmentTime" th:value="${appointmentTime}">

                <button type="submit">Reschedule Appointment</button>
                <a href="/patient/my-appointments" class="btn-cancel">Cancel</a>
            </form>

            <div class="form-info">
                💡 Select your preferred new appointment date and time
            </div>

            <div class="back-link">
                <a href="/patient/my-appointments">← Back to Appointments</a>
            </div>
        </div>
    </div>
</body>
</html>
