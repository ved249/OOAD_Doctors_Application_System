<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Book Appointment - Doctor Appointment System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            max-width: 500px;
            width: 100%;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 30px;
            text-align: center;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            text-align: left;
            flex: 1;
        }

        .header h2 {
            font-size: 28px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .header p {
            font-size: 13px;
            opacity: 0.9;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .form-container {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="datetime-local"],
        select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input[type="datetime-local"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button[type="submit"] {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 14px;
            border-left: 4px solid #28a745;
            animation: slideIn 0.3s ease;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            border-left: 4px solid #c33;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .form-info {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            border: 1px solid #e0e7ff;
            font-size: 13px;
            color: #555;
            text-align: center;
        }

        .icon {
            font-size: 30px;
            margin-right: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <div class="icon" style="display: inline; margin-right: 10px;">📅</div>
                <h2>Book Appointment</h2>
                <p>Schedule your consultation</p>
            </div>
            <a href="/patient/logout" class="logout-btn">Logout</a>
        </div>

        <div class="form-container">
            <div class="success-message" th:if="${message}" th:text="${message}"></div>
            <div class="error-message" th:if="${error}" th:text="${error}"></div>

            <!-- SEARCH & FILTER SECTION -->
            <div style="background: #f5f7ff; padding: 20px; border-radius: 10px; margin-bottom: 25px; border: 1px solid #e0e7ff;">
                <h3 style="color: #333; margin-bottom: 15px; font-size: 16px;">🔍 Search & Filter Doctors</h3>
                
                <!-- Filter by Specialization -->
                <form method="get" action="/patient/book-appointment" style="margin-bottom: 15px;">
                    <div class="form-group">
                        <label>Filter by Specialization:</label>
                        <select name="specialization" onchange="this.form.submit()">
                            <option value="">-- All Specializations --</option>
                            <option th:each="spec : ${specializations}" th:value="${spec}" th:text="${spec}" th:selected="${selectedSpecialization == spec}"></option>
                        </select>
                    </div>
                </form>

                <!-- Search by Name -->
                <form method="get" action="/patient/book-appointment" style="margin-bottom: 0;">
                    <div class="form-group">
                        <label>Search by Doctor Name:</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="text" name="searchName" placeholder="Enter doctor name..." th:value="${searchName}" style="flex: 1; padding: 12px 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px;">
                            <button type="submit" style="padding: 12px 24px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; white-space: nowrap; transition: all 0.3s ease;">Search</button>
                        </div>
                    </div>
                </form>
            </div>

            <form method="post" action="/patient/book-appointment">
                <div class="form-group">
                    <label>Select Doctor:</label>
                    <select name="doctorId" required>
                        <option value="">-- Choose a Doctor --</option>
                        <option th:each="doctor : ${doctors}" th:value="${doctor.doctorId}" th:text="${doctor.doctorName}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Appointment Date & Time:</label>
                    <input type="datetime-local" name="appointmentDateTime" required>
                </div>

                <button type="submit">Book Appointment</button>
            </form>

            <div class="form-info">
                💡 Filter doctors by specialization or search by name, then select preferred appointment time
            </div>
        </div>
    </div>
</body>
</html>
