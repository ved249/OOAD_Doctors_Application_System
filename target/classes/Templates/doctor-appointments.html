<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Appointments - Doctor Appointment System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header-left p {
            font-size: 14px;
            opacity: 0.9;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .logout-btn, .patients-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .logout-btn:hover, .patients-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .content {
            padding: 40px 30px;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #c33;
            font-size: 14px;
        }

        .appointments-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .appointments-table th {
            background: #f8f9ff;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #e0e7ff;
            font-size: 14px;
        }

        .appointments-table td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
            color: #555;
        }

        .appointments-table tr:hover {
            background: #f8f9ff;
        }

        .no-appointments {
            text-align: center;
            padding: 60px 30px;
            color: #999;
        }

        .no-appointments-icon {
            font-size: 60px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .no-appointments-text {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .no-appointments-desc {
            font-size: 14px;
            color: #bbb;
        }

        .patient-info {
            font-weight: 600;
            color: #333;
        }

        .time-info {
            color: #667eea;
            font-weight: 600;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            min-width: 90px;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .status-approved {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-rejected {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-small {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-approve {
            background: #28a745;
            color: white;
        }

        .btn-approve:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        .btn-reject {
            background: #f5576c;
            color: white;
        }

        .btn-reject:hover {
            background: #d63447;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .back-link {
            text-align: center;
            margin-top: 30px;
        }

        .back-link a {
            color: #f5576c;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .message-box {
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 14px;
            border-left: 4px solid #28a745;
            background: #d4edda;
            color: #155724;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <h1>📅 My Appointments</h1>
                <p>Hello, Dr. <span th:text="${doctorName}"></span></p>
            </div>
            <div class="header-buttons">
                <a href="/doctor/patients" class="patients-btn">👥 My Patients</a>
                <a href="/doctor/logout" class="logout-btn">Logout</a>
            </div>
        </div>

        <div class="content">
            <div class="message-box" th:if="${message}" th:text="${message}"></div>
            <div class="error-message" th:if="${error}" th:text="${error}"></div>

            <div th:if="${appointments != null and appointments.size() > 0}">
                <table class="appointments-table">
                    <thead>
                        <tr>
                            <th>Patient Name</th>
                            <th>Email</th>
                            <th>Contact</th>
                            <th>Appointment Date & Time</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="appointment : ${appointments}">
                            <td class="patient-info" th:text="${appointment.patient.patientFirstName} + ' ' + ${appointment.patient.patientLastName}"></td>
                            <td th:text="${appointment.patient.patientEmail}"></td>
                            <td th:text="${appointment.patient.patientContact}"></td>
                            <td class="time-info" th:text="${#temporals.format(appointment.id.time, 'dd MMM yyyy, HH:mm')}"></td>
                            <td>
                                <span th:class="${'status-badge status-' + appointment.status.name().toLowerCase()}" 
                                      th:text="${appointment.status.displayName}"></span>
                            </td>
                            <td>
                                <div class="action-buttons">
                                    <form method="post" action="/doctor/approve-appointment" style="display:inline;" th:if="${appointment.status.name() == 'PENDING'}">
                                        <input type="hidden" name="appointmentId" th:value="${appointment.id.appointmentId}">
                                        <input type="hidden" name="appointmentTime" th:value="${appointment.id.time}">
                                        <button type="submit" class="btn-small btn-approve">Approve</button>
                                    </form>
                                    <form method="post" action="/doctor/reject-appointment" style="display:inline;" th:if="${appointment.status.name() == 'PENDING'}">
                                        <input type="hidden" name="appointmentId" th:value="${appointment.id.appointmentId}">
                                        <input type="hidden" name="appointmentTime" th:value="${appointment.id.time}">
                                        <button type="submit" class="btn-small btn-reject" onclick="return confirm('Are you sure you want to reject this appointment?')">Reject</button>
                                    </form>
                                    <span th:if="${appointment.status.name() != 'PENDING'}" style="color: #999; font-size: 12px;">—</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div th:if="${appointments == null or appointments.size() == 0}">
                <div class="no-appointments">
                    <div class="no-appointments-icon">📭</div>
                    <div class="no-appointments-text">No Appointments</div>
                    <div class="no-appointments-desc">You don't have any appointments scheduled yet</div>
                </div>
            </div>

            <div class="back-link">
                <a href="/">← Back to Home</a>
            </div>
        </div>
    </div>
</body>
</html>
